<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#f1f2ef"/>

    <text x="48" y="72" font-family="Barlow, Noto Sans, sans-serif" font-size="22" font-weight="600" fill="#0e1b33">Pay M<tspan fill="#c4122f">€</tspan></text>

    <text x="44" y="215" font-family="Barlow, Noto Sans, sans-serif" font-size="96" font-weight="600" letter-spacing="-3" fill="#0e1b33">{{ amount }} <tspan fill="#c4122f">€</tspan></text>
    <text x="48" y="262" font-family="Barlow, Noto Sans, sans-serif" font-size="28" font-weight="500" fill="#0e1b33">to {{ payee_name }}</text>

    <rect x="48" y="304" width="504" height="48" rx="4" fill="#e1e6ee"/>
    <text x="64" y="334" font-family="Barlow, Noto Sans, sans-serif" font-size="17" font-weight="500" fill="#46516a">{% if has_paypal %}PayPal, bank transfer or QR code{% else %}Bank transfer or QR code{% endif %}</text>
</svg>
