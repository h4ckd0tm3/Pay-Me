<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f1f2ef">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}Pay M€{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Create a payment link with bank details and a transfer QR code.{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{{ url_for('static', filename='img/favicon.ico', _external=True) }}{% endblock %}">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:site_name" content="Pay M€">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="800">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ self.og_title() }}">
    <meta name="twitter:description" content="{{ self.og_description() }}">
    <meta name="twitter:image" content="{{ self.og_image() }}">

    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <title>{% block title %}Pay M€{% endblock %}</title>
</head>
<body>
<header class="site-header">
    <div class="wrap">
        <a class="wordmark" href="{{ url_for('main') }}">Pay M<span class="euro">€</span></a>
        {% block nav %}{% endblock %}
    </div>
</header>
<main>
    <div class="wrap">
        {% block content %}{% endblock %}
    </div>
</main>
<footer class="site-footer">
    <div class="wrap">
        Made by <a href="https://schnideritsch.at">Marcel Schnideritsch</a>
    </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
